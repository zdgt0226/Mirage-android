name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  rust:
    name: Rust (Format, Clippy & Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cargo fmt check (mirage-core)
        working-directory: native/mirage-core
        run: cargo fmt --check

      - name: Cargo clippy (mirage-core)
        working-directory: native/mirage-core
        run: cargo clippy --lib -- -D warnings

      - name: Cargo test (mirage-core)
        working-directory: native/mirage-core
        run: cargo test --lib

      - name: Cargo fmt check (mirage-jni)
        working-directory: native/mirage-jni
        run: cargo fmt --check

      - name: Cargo clippy (mirage-jni)
        working-directory: native/mirage-jni
        run: cargo clippy --lib -- -D warnings

  android:
    name: Android (Build & Unit Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.3.11579264"
          echo "ndk.dir=$ANDROID_HOME/ndk/26.3.11579264" >> android/local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Kotlin Compile & Unit Tests
        working-directory: android
        run: ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: android/app/build/reports/tests/
