name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  rust:
    name: Rust (Format, Clippy & Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cargo fmt check (mirage-core)
        working-directory: native/mirage-core
        run: cargo fmt --check

      - name: Cargo clippy (mirage-core)
        working-directory: native/mirage-core
        run: cargo clippy --lib -- -D warnings

      - name: Cargo test (mirage-core)
        working-directory: native/mirage-core
        run: cargo test --lib

      - name: Cargo fmt check (mirage-jni)
        working-directory: native/mirage-jni
        run: cargo fmt --check

      - name: Cargo clippy (mirage-jni)
        working-directory: native/mirage-jni
        run: cargo clippy --lib -- -D warnings

  android:
    name: Android (Build, Unit Tests & JNI Surface Gate)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.3.11579264"
          echo "ndk.dir=$ANDROID_HOME/ndk/26.3.11579264" >> android/local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Kotlin Compile & Unit Tests
        working-directory: android
        run: ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon

      # assembleRelease 需要 jniLibs（.gitignore，不入库），故在 CI 现编一份 arm64 .so。
      # 没有这一步就无法运行 R8，而 R8 正是下面那道断言要保护的东西。
      - name: Set up Rust for Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Build native library (arm64-v8a)
        run: |
          cargo install cargo-ndk --locked
          cd native/mirage-jni
          cargo ndk -t arm64-v8a -o ../../android/app/src/main/jniLibs build --release

      - name: Assemble release (R8)
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon

      # JNI 边界回归门禁。
      #
      # mirage-jni 按字符串反查 MirageNative 并按方法名调用 protectFd /
      # resolveConnectionOwner（native/mirage-jni/src/lib.rs）。R8 一旦把它们
      # 重命名或裁掉，隧道 socket 不再被 protect，会被路由回 TUN 形成自环——
      # 表现为「显示已连接但零吞吐」，静默且极难排查。keep 规则失效必须在这里拦住。
      - name: Assert JNI surface survived R8
        working-directory: android
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "检查 $APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          WORK=$(mktemp -d)
          unzip -q -o "$APK" 'classes*.dex' -d "$WORK"
          for d in "$WORK"/classes*.dex; do "$BT/dexdump" -d "$d"; done > "$WORK/all.txt"
          fail=0
          for sym in \
            "Lcom/mirage/android/core/MirageNative;" \
            "protectFd" \
            "resolveConnectionOwner" \
            "Lcom/mirage/android/core/ICoreService"
          do
            n=$(grep -c -- "$sym" "$WORK/all.txt" || true)
            printf '%-46s %s\n' "$sym" "$n"
            if [ "$n" -eq 0 ]; then
              echo "::error::R8 裁剪或重命名了 JNI 必需符号: $sym —— keep 规则已失效"
              fail=1
            fi
          done
          # 原生库的动态导出表也必须完好（strip 只应去掉调试符号）
          unzip -q -o "$APK" 'lib/*/*.so' -d "$WORK"
          exports=$(nm -D --defined-only "$WORK"/lib/arm64-v8a/libmirage_jni.so | grep -c "Java_com_mirage" || true)
          echo "Java_com_mirage 导出符号: $exports"
          if [ "$exports" -eq 0 ]; then
            echo "::error::libmirage_jni.so 未导出任何 JNI 符号"
            fail=1
          fi
          exit $fail

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: android/app/build/reports/tests/
