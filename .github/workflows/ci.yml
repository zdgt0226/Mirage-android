name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  rust:
    name: Rust (Format, Clippy & Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # 不指定版本: 由仓库根的 rust-toolchain.toml 驱动 (channel/components/targets
      # 都在那里声明)。rustup show 会据此把工具链落地。指定版本会与该文件冲突,
      # 且让「升级 rustc」变成要同时改两处。
      - name: Set up Rust (from rust-toolchain.toml)
        run: rustup show

      - name: Cargo fmt check (mirage-core)
        working-directory: native/mirage-core
        run: cargo fmt --check

      - name: Cargo clippy (mirage-core)
        working-directory: native/mirage-core
        run: cargo clippy --lib -- -D warnings

      - name: Cargo test (mirage-core)
        working-directory: native/mirage-core
        run: cargo test --lib

      - name: Cargo fmt check (mirage-jni)
        working-directory: native/mirage-jni
        run: cargo fmt --check

      - name: Cargo clippy (mirage-jni)
        working-directory: native/mirage-jni
        run: cargo clippy --lib -- -D warnings

  android:
    name: Android (Build, Unit Tests & JNI Surface Gate)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # packages: '' —— 不装该 action 的默认包 (v4 默认是 platform-tools, 本项目
      # 不需要 adb/fastboot)。NDK 与 build-tools 由下一步显式安装。
      #
      # 历史: v3 的默认包是 'tools', 而 cmdline-tools 16.0 起已移除它 —— sdkmanager
      # 报 "Failed to find package 'tools'" 并以 1 退出, 整个 job 挂在这里 (CI 首跑
      # 实测)。v4 已在 action 内部过滤掉 'tools', 该失败不会再复现。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install NDK and build-tools
        run: |
          # yes 而非 echo "y": 后者只答一次, 多张许可时第二个提示拿到 EOF 视为拒绝
          # 走 PATH 而非 $ANDROID_HOME/cmdline-tools/latest/bin —— setup-android v4
          # 把 cmdline-tools 装到 cmdline-tools/<版本> (如 20.0), 只有命中预装且版本
          # 相符时才用 latest。该 action 会把实际所在目录 addPath, 故 PATH 是稳的。
          # NDK 版本从 libs.versions.toml 取, 不在这里写第二份。解析不出就地失败 ——
          # 静默装错版本会在 assembleRelease 才炸, 且报的是"NDK not configured"。
          NDK_VERSION=$(sed -n 's/^ndk = "\(.*\)"$/\1/p' android/gradle/libs.versions.toml)
          [ -n "$NDK_VERSION" ] || { echo "::error::无法从 libs.versions.toml 解析 ndk 版本"; exit 1; }
          echo "NDK 版本 (来自 libs.versions.toml): $NDK_VERSION"

          yes | sdkmanager "ndk;$NDK_VERSION" "build-tools;34.0.0" "platforms;android-36" "build-tools;36.0.0"

          # sdkmanager 对未知包名只是告警, 不以非零退出。装没装上要自己看 ——
          # 装不上时 AGP 不会失败, 只会少做一步 strip (见下方 Assemble release)。
          [ -d "$ANDROID_HOME/ndk/$NDK_VERSION" ] || {
            echo "::error::NDK $NDK_VERSION 未安装成功, 检查 libs.versions.toml 里的版本号是否存在"
            exit 1
          }
          # 不写 local.properties 的 ndk.dir。AGP 已弃用该方式 ([CXX5106]), 且它优先级
          # 高于 ndkVersion —— build.gradle.kts 的 ndkVersion (取自 libs.versions.toml)
          # 才是唯一来源, AGP 会据此在 $ANDROID_HOME/ndk/<版本> 找, 正是上面装的位置。
          #
          # cargo-ndk 不读 Gradle 的任何配置, 必须单独给它一个环境变量。
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> $GITHUB_ENV

      # 停在 v5 是刻意的, 不是漏升。gradle/actions@v6 把缓存逻辑抽成闭源的
      # gradle-actions-caching 组件, 用它即视为接受 Gradle 的商业条款
      # (https://gradle.com/legal/terms-of-use/)。v5 仍是 MIT 且已跑 node 24。
      # 要升 v6 需要先有人决定接受那份条款。
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run Kotlin Compile & Unit Tests
        working-directory: android
        run: ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon

      # assembleRelease 需要 jniLibs（.gitignore，不入库），故在 CI 现编一份 arm64 .so。
      # 没有这一步就无法运行 R8，而 R8 正是下面那道断言要保护的东西。
      - name: Set up Rust for Android target (from rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            native/mirage-jni/target
          key: ndk-${{ runner.os }}-${{ hashFiles('native/*/Cargo.lock') }}

      - name: Build native library (arm64-v8a)
        run: |
          # 固定版本: --locked 只锁依赖树, 不锁 cargo-ndk 自身版本
          cargo install cargo-ndk --locked --version 3.5.4 || true
          cd native/mirage-jni
          cargo ndk -t arm64-v8a -o ../../android/app/src/main/jniLibs build --release

      # .so 体积守卫: 移动端内核裁剪的 CI 卡尺。当前 opt-level=s + strip + lto + cg1 下 arm64 ≈ 3.0-3.3MB。
      # 阈值 4 MiB 留足头量, 只掐"依赖爆炸/误开 feature/退回 opt=3"这类回胖 (+25%↑)。回胖时先 `cargo bloat`
      # 或 `cargo tree` 查根因; 确属合理增长再调高阈值 (显式改动, 别默默放大)。
      - name: .so 体积守卫 (arm64, 防回胖)
        run: |
          so=android/app/src/main/jniLibs/arm64-v8a/libmirage_jni.so
          sz=$(stat -c%s "$so")
          max=$((4 * 1024 * 1024))
          echo "::notice::libmirage_jni.so (arm64-v8a) = ${sz} bytes (~$((sz/1024)) KiB), 上限 $((max/1024)) KiB"
          if [ "$sz" -gt "$max" ]; then
            echo "::error::.so 体积 $sz > 上限 $max —— 移动端内核回胖了。查依赖 (cargo bloat / cargo tree), 或显式调高阈值。"
            exit 1
          fi

      # 若未配置真实分发密钥，在 CI 临时生成一个 keystore 仅用于验证 APK zip 16KB 对齐。
      # 该临时 keystore 绝不用于分发。
      - name: Prepare signing key for release
        working-directory: android
        run: |
          if [ -z "${MIRAGE_KEYSTORE_PATH:-}" ] || [ ! -f "${MIRAGE_KEYSTORE_PATH}" ]; then
            echo "未检测到分发签名密钥，生成临时 keystore 供 CI 16KB 对齐门禁验证 (非分发)"
            keytool -genkeypair -v \
              -keystore ci-temp.keystore \
              -alias citemp \
              -keyalg RSA \
              -keysize 2048 \
              -validity 1 \
              -storepass mirage-ci-temp \
              -keypass mirage-ci-temp \
              -dname "CN=Mirage CI Temp, OU=CI, O=Mirage, L=Unknown, ST=Unknown, C=XX"
            echo "MIRAGE_KEYSTORE_PATH=ci-temp.keystore" >> $GITHUB_ENV
            echo "MIRAGE_KEYSTORE_PASSWORD=mirage-ci-temp" >> $GITHUB_ENV
            echo "MIRAGE_KEY_ALIAS=citemp" >> $GITHUB_ENV
            echo "MIRAGE_KEY_PASSWORD=mirage-ci-temp" >> $GITHUB_ENV
          fi

      # 不是单纯跑构建: 还要断言 AGP 真的找到了 NDK。
      #
      # AGP 找不到 ndkVersion 指定的 NDK 时**不会失败** —— 只打一行
      # "Unable to strip the following libraries, packaging them as they are"
      # 然后 BUILD SUCCESSFUL (容器内把版本改成 99.9.99999999 实测)。
      # 于是版本写错的唯一症状是产物带着符号发出去, 没有任何红灯。
      - name: Assemble release (R8)
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon 2>&1 | tee /tmp/assemble.log
          if grep -q "Unable to strip" /tmp/assemble.log; then
            echo "::error::AGP 未能 strip 原生库 —— 通常意味着它没找到 ndkVersion 指定的 NDK"
            grep "Unable to strip" /tmp/assemble.log
            exit 1
          fi

      # 最低支持版本门禁。
      #
      # 项目要求最低支持 Android 9 (API 28)；当前 minSdk=26, 有两级余量。
      # 风险不在主动决策, 在依赖升级: AGP 与 AndroidX 版本一动, 某些库会声明更高的
      # minSdk, 而 **Gradle 取所有依赖的最大值合并且不报错**。等发现时已经装不上老机器。
      # 所以断言的是**最终产物**里的值, 而不是 build.gradle.kts 里写的那个。
      #
      # 取值行是 minSdkVersion:, 不是 sdkVersion: —— 后者不存在, 写错会让 sed 静默取空,
      # 门禁变成永远通过 (本仓库第一版判据就踩了这个)。因此解析为空一律判失败。
      - name: Assert minSdk still supports Android 9 (API 28)
        working-directory: android
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          MIN=$("$BT/aapt2" dump badging "$APK" | sed -n "s/^minSdkVersion:'\([0-9]*\)'.*/\1/p")
          TGT=$("$BT/aapt2" dump badging "$APK" | sed -n "s/^targetSdkVersion:'\([0-9]*\)'.*/\1/p")
          printf '%-28s %s\n' "产物 minSdkVersion" "${MIN:-<解析失败>}"
          printf '%-28s %s\n' "产物 targetSdkVersion" "${TGT:-<解析失败>}"
          if [ -z "$MIN" ]; then
            echo "::error::无法从 APK 解析 minSdkVersion —— 判据失效, 按失败处理"
            exit 1
          fi
          if [ "$MIN" -gt 28 ]; then
            echo "::error::minSdk 已升到 $MIN, 超过项目要求的 Android 9 (API 28)。"
            echo "::error::多半是某个依赖抬高了下限 —— 查 ./gradlew :app:dependencies"
            exit 1
          fi

      # 16KB 内存页对齐门禁。
      #
      # Android 15+ 设备要求 APK 内所有未压缩的 .so 库必须按 16KB (16384 字节) 边界对齐。
      # ELF 段对齐已由 cargo 配置完成；此处的门禁确保签名和 zipalign 后的 APK 容器内
      # 数据偏移 % 16384 == 0。解析不到任何 .so 必须判失败，不能当作通过。
      - name: Assert APK zip 16KB alignment for uncompressed .so
        working-directory: android
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "检查 APK 16KB 对齐: $APK"
          python3 - <<'EOF' "$APK"
          import sys, zipfile, struct

          apk_path = sys.argv[1]
          found_so = 0
          failed = 0

          with open(apk_path, "rb") as f:
              with zipfile.ZipFile(f) as zf:
                  for info in zf.infolist():
                      if not info.filename.endswith(".so"):
                          continue
                      found_so += 1
                      f.seek(info.header_offset)
                      local_header = f.read(30)
                      if len(local_header) < 30 or local_header[:4] != b'PK\x03\x04':
                          print(f"::error::无效的 ZIP 本地文件头: {info.filename}")
                          failed += 1
                          continue
                      compress_type, = struct.unpack_from("<H", local_header, 8)
                      fname_len, extra_len = struct.unpack_from("<HH", local_header, 26)
                      data_offset = info.header_offset + 30 + fname_len + extra_len
                      rem = data_offset % 16384
                      print(f"{info.filename}: compress_type={compress_type}, offset={data_offset}, rem_16k={rem}")
                      if compress_type != 0:
                          print(f"::error::{info.filename} 未存储为未压缩状态 (compress_type={compress_type})")
                          failed += 1
                      elif rem != 0:
                          print(f"::error::{info.filename} 数据偏移 {data_offset} 未按 16KB 对齐 (余数 {rem})")
                          failed += 1

          if found_so == 0:
              print("::error::APK 中未发现任何 .so 原生库，对齐门禁判定失败")
              sys.exit(1)

          if failed > 0:
              print(f"::error::发现 {failed} 处 .so 对齐缺陷")
              sys.exit(1)

          print(f"16KB 对齐门禁通过: 共检测 {found_so} 个 .so 库，全部满足未压缩且 16KB 边界对齐。")
          EOF

      # JNI 边界回归门禁。
      #
      # mirage-jni 按字符串反查 MirageNative 并按方法名调 protectFd /
      # resolveConnectionOwner（native/mirage-jni/src/lib.rs）。R8 一旦把它们
      # 重命名或裁掉，隧道 socket 不再被 protect，会被路由回 TUN 形成自环——
      # 表现为「显示已连接但零吞吐」，静默且极难排查。
      #
      # 断言必须用全限定名: CoreService 里有一个同名的 protectFd 转发方法，
      # 由另一条独立的 keep 规则保护。未限定的 grep 会被它掩护——实测削弱
      # MirageNative 的成员保留后，未限定断言仍返回 2 而判通过，新断言返回 0 并失败。
      - name: Assert JNI surface survived R8
        working-directory: android
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "检查 $APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          WORK=$(mktemp -d)
          unzip -q -o "$APK" 'classes*.dex' 'lib/*/*.so' -d "$WORK"
          for d in "$WORK"/classes*.dex; do "$BT/dexdump" -d "$d"; done > "$WORK/all.txt"
          SO="$WORK/lib/arm64-v8a/libmirage_jni.so"
          fail=0

          # 1. Rust 按名反查的两个 Kotlin 方法（全限定，含签名）
          for q in \
            "com.mirage.android.core.MirageNative.protectFd:(I)V" \
            "com.mirage.android.core.MirageNative.resolveConnectionOwner:"
          do
            n=$(grep -cF -- "$q" "$WORK/all.txt" || true)
            printf '%-58s %s\n' "$q" "$n"
            if [ "$n" -eq 0 ]; then
              echo "::error::R8 重命名或裁剪了 $q —— keep 规则已失效"
              fail=1
            fi
          done

          # 2. MirageNative 的 native 方法数必须与 .so 导出的 JNI 符号数相等。
          #    任一侧被裁剪或重命名都会破坏等式。
          dex_native=$(awk '
            /Class descriptor  : .Lcom\/mirage\/android\/core\/MirageNative;./ {inclass=1; next}
            inclass && /Class descriptor  :/ {exit}
            inclass && /NATIVE/ {n++}
            END {print n+0}' "$WORK/all.txt")
          so_exports=$(nm -D --defined-only "$SO" | grep -c "Java_com_mirage" || true)
          printf '%-58s %s\n' "dex 内 MirageNative native 方法数" "$dex_native"
          printf '%-58s %s\n' ".so 导出 Java_com_mirage 符号数" "$so_exports"
          if [ "$dex_native" -eq 0 ] || [ "$so_exports" -eq 0 ]; then
            echo "::error::JNI 方法表为空 (dex=$dex_native so=$so_exports)"
            fail=1
          elif [ "$dex_native" -ne "$so_exports" ]; then
            echo "::error::JNI 方法数不匹配: dex=$dex_native so=$so_exports"
            fail=1
          fi

          # 3. AIDL 接口
          n=$(grep -c "Lcom/mirage/android/core/ICoreService" "$WORK/all.txt" || true)
          printf '%-58s %s\n' "ICoreService 类描述符" "$n"
          if [ "$n" -eq 0 ]; then
            echo "::error::ICoreService 被裁剪"
            fail=1
          fi

          exit $fail

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: android/app/build/reports/tests/
