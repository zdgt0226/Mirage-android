name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  rust:
    name: Rust (Format, Clippy & Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # 不指定版本: 由仓库根的 rust-toolchain.toml 驱动 (channel/components/targets
      # 都在那里声明)。rustup show 会据此把工具链落地。指定版本会与该文件冲突,
      # 且让「升级 rustc」变成要同时改两处。
      - name: Set up Rust (from rust-toolchain.toml)
        run: rustup show

      - name: Cargo fmt check (mirage-core)
        working-directory: native/mirage-core
        run: cargo fmt --check

      - name: Cargo clippy (mirage-core)
        working-directory: native/mirage-core
        run: cargo clippy --lib -- -D warnings

      - name: Cargo test (mirage-core)
        working-directory: native/mirage-core
        run: cargo test --lib

      - name: Cargo fmt check (mirage-jni)
        working-directory: native/mirage-jni
        run: cargo fmt --check

      - name: Cargo clippy (mirage-jni)
        working-directory: native/mirage-jni
        run: cargo clippy --lib -- -D warnings

  android:
    name: Android (Build, Unit Tests & JNI Surface Gate)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # packages: '' —— 不装该 action 的默认包 (v4 默认是 platform-tools, 本项目
      # 不需要 adb/fastboot)。NDK 与 build-tools 由下一步显式安装。
      #
      # 历史: v3 的默认包是 'tools', 而 cmdline-tools 16.0 起已移除它 —— sdkmanager
      # 报 "Failed to find package 'tools'" 并以 1 退出, 整个 job 挂在这里 (CI 首跑
      # 实测)。v4 已在 action 内部过滤掉 'tools', 该失败不会再复现。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install NDK and build-tools
        run: |
          # yes 而非 echo "y": 后者只答一次, 多张许可时第二个提示拿到 EOF 视为拒绝
          # 走 PATH 而非 $ANDROID_HOME/cmdline-tools/latest/bin —— setup-android v4
          # 把 cmdline-tools 装到 cmdline-tools/<版本> (如 20.0), 只有命中预装且版本
          # 相符时才用 latest。该 action 会把实际所在目录 addPath, 故 PATH 是稳的。
          yes | sdkmanager "ndk;26.3.11579264" "build-tools;34.0.0"
          # 不写 local.properties 的 ndk.dir。AGP 已弃用该方式 ([CXX5106]), 且它优先级
          # 高于 ndkVersion —— app/build.gradle.kts 里的 ndkVersion 才是唯一来源,
          # AGP 会据此在 $ANDROID_HOME/ndk/<版本> 找, 正是上面装进去的位置。
          #
          # cargo-ndk 不读 Gradle 的任何配置, 必须单独给它一个环境变量。
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV

      # 停在 v5 是刻意的, 不是漏升。gradle/actions@v6 把缓存逻辑抽成闭源的
      # gradle-actions-caching 组件, 用它即视为接受 Gradle 的商业条款
      # (https://gradle.com/legal/terms-of-use/)。v5 仍是 MIT 且已跑 node 24。
      # 要升 v6 需要先有人决定接受那份条款。
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run Kotlin Compile & Unit Tests
        working-directory: android
        run: ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon

      # assembleRelease 需要 jniLibs（.gitignore，不入库），故在 CI 现编一份 arm64 .so。
      # 没有这一步就无法运行 R8，而 R8 正是下面那道断言要保护的东西。
      - name: Set up Rust for Android target (from rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            native/mirage-jni/target
          key: ndk-${{ runner.os }}-${{ hashFiles('native/*/Cargo.lock') }}

      - name: Build native library (arm64-v8a)
        run: |
          # 固定版本: --locked 只锁依赖树, 不锁 cargo-ndk 自身版本
          cargo install cargo-ndk --locked --version 3.5.4 || true
          cd native/mirage-jni
          cargo ndk -t arm64-v8a -o ../../android/app/src/main/jniLibs build --release

      - name: Assemble release (R8)
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon

      # JNI 边界回归门禁。
      #
      # mirage-jni 按字符串反查 MirageNative 并按方法名调 protectFd /
      # resolveConnectionOwner（native/mirage-jni/src/lib.rs）。R8 一旦把它们
      # 重命名或裁掉，隧道 socket 不再被 protect，会被路由回 TUN 形成自环——
      # 表现为「显示已连接但零吞吐」，静默且极难排查。
      #
      # 断言必须用全限定名: CoreService 里有一个同名的 protectFd 转发方法，
      # 由另一条独立的 keep 规则保护。未限定的 grep 会被它掩护——实测削弱
      # MirageNative 的成员保留后，未限定断言仍返回 2 而判通过，新断言返回 0 并失败。
      - name: Assert JNI surface survived R8
        working-directory: android
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "检查 $APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          WORK=$(mktemp -d)
          unzip -q -o "$APK" 'classes*.dex' 'lib/*/*.so' -d "$WORK"
          for d in "$WORK"/classes*.dex; do "$BT/dexdump" -d "$d"; done > "$WORK/all.txt"
          SO="$WORK/lib/arm64-v8a/libmirage_jni.so"
          fail=0

          # 1. Rust 按名反查的两个 Kotlin 方法（全限定，含签名）
          for q in \
            "com.mirage.android.core.MirageNative.protectFd:(I)V" \
            "com.mirage.android.core.MirageNative.resolveConnectionOwner:"
          do
            n=$(grep -cF -- "$q" "$WORK/all.txt" || true)
            printf '%-58s %s\n' "$q" "$n"
            if [ "$n" -eq 0 ]; then
              echo "::error::R8 重命名或裁剪了 $q —— keep 规则已失效"
              fail=1
            fi
          done

          # 2. MirageNative 的 native 方法数必须与 .so 导出的 JNI 符号数相等。
          #    任一侧被裁剪或重命名都会破坏等式。
          dex_native=$(awk '
            /Class descriptor  : .Lcom\/mirage\/android\/core\/MirageNative;./ {inclass=1; next}
            inclass && /Class descriptor  :/ {exit}
            inclass && /NATIVE/ {n++}
            END {print n+0}' "$WORK/all.txt")
          so_exports=$(nm -D --defined-only "$SO" | grep -c "Java_com_mirage" || true)
          printf '%-58s %s\n' "dex 内 MirageNative native 方法数" "$dex_native"
          printf '%-58s %s\n' ".so 导出 Java_com_mirage 符号数" "$so_exports"
          if [ "$dex_native" -eq 0 ] || [ "$so_exports" -eq 0 ]; then
            echo "::error::JNI 方法表为空 (dex=$dex_native so=$so_exports)"
            fail=1
          elif [ "$dex_native" -ne "$so_exports" ]; then
            echo "::error::JNI 方法数不匹配: dex=$dex_native so=$so_exports"
            fail=1
          fi

          # 3. AIDL 接口
          n=$(grep -c "Lcom/mirage/android/core/ICoreService" "$WORK/all.txt" || true)
          printf '%-58s %s\n' "ICoreService 类描述符" "$n"
          if [ "$n" -eq 0 ]; then
            echo "::error::ICoreService 被裁剪"
            fail=1
          fi

          exit $fail

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: android/app/build/reports/tests/
