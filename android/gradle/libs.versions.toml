[versions]
agp = "8.7.3"
kotlin = "2.1.0"
coreKtx = "1.13.1"
appcompat = "1.7.0"
material = "1.12.0"
constraintlayout = "2.1.4"
recyclerview = "1.3.2"
viewpager2 = "1.1.0"
lifecycle = "2.8.6"
fragmentKtx = "1.8.4"
junit = "4.13.2"
